name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild \
            -project Rooted.xcodeproj \
            -scheme Rooted \
            -configuration Release \
            -derivedDataPath build \
            -destination 'platform=macOS' \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Sign app (ad-hoc)
        run: codesign --force --deep --sign - build/Build/Products/Release/Rooted.app

      - name: Verify app
        run: |
          codesign --verify --deep --strict --verbose=2 build/Build/Products/Release/Rooted.app
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" build/Build/Products/Release/Rooted.app/Contents/Info.plist

      - name: Package
        run: |
          mkdir -p dist build/dmg
          ditto -c -k --keepParent build/Build/Products/Release/Rooted.app "dist/Rooted-${GITHUB_REF_NAME}.zip"
          cp -R build/Build/Products/Release/Rooted.app build/dmg/
          ln -s /Applications build/dmg/Applications
          hdiutil create \
            -volname "Rooted" \
            -srcfolder build/dmg \
            -ov -format UDZO \
            "dist/Rooted-${GITHUB_REF_NAME}.dmg"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rooted-${{ github.run_number }}
          path: |
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/*.zip dist/*.dmg --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/*.zip dist/*.dmg \
              --title "Rooted ${GITHUB_REF_NAME}" \
              --generate-notes \
              --latest
          fi
