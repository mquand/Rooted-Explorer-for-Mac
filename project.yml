name: Rooted

options:
  bundleIdPrefix: com.rooted
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"

targets:
  Rooted:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Models
      - path: Services
      - path: Utils
      - path: ViewModels
      - path: Views
      - path: Resources
    settings:
      base:
        PRODUCT_NAME: Rooted
        PRODUCT_BUNDLE_IDENTIFIER: com.rooted.explorer
        MARKETING_VERSION: "0.2.1"
        CURRENT_PROJECT_VERSION: "3"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_CFBundleDisplayName: Rooted
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""

schemes:
  Rooted:
    build:
      targets:
        Rooted: all
    run:
      config: Debug
    archive:
      config: Release
